name: gate

# The claim this repository makes is that its JAX ports are numerically equal to the
# original PyTorch references and that its statistical machinery behaves as described.
# CI exists to keep that claim true on a clean machine, not to lint.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (CPU wheels only)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-jax.txt
          python -m pip install -e .

      - name: Correctness gate
        run: python -m pytest tests/ -q

      - name: Self-checks that are not pytest
        run: |
          python -m pinca_jax.stats
          python -m pinca_jax.physics
          python -m pinca_jax.models.baselines
          python -m pinca_jax.teacher_error --demo

      # Exercise the ACTUAL one command a user runs, not a hand-rolled approximation of
      # it. This is what catches a launcher that has drifted from the pipeline -- which
      # had already happened once in this repository. Two phenomena and four
      # architectures keep it to a few minutes; the numbers are meaningless by design and
      # every driver says so in its own output.
      - name: The one command (tiny, CPU, numbers meaningless)
        run: bash run_paper.sh --profile smoke --allow-cpu --no-gate --only bench2d,teacher,plots,claims

      - name: Launcher aliases and stage list still resolve
        run: |
          bash run_gpu.sh --list-stages
          bash run_paper.sh --list-stages

      # Regenerate the audit, the paper tables and every quoted number, and fail if any
      # count in the prose disagrees with what is actually in results/.
      - name: Documents must agree with the results
        run: |
          python -m pinca_jax.claims --strict-counts
          python -m pinca_jax.paper
          python -m pytest tests/test_paper.py -q
