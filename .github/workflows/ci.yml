name: gate

# The claim this repository makes is that its JAX ports are numerically equal to the
# original PyTorch references and that its statistical machinery behaves as described.
# CI exists to keep that claim true on a clean machine, not to lint.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (CPU wheels only)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-jax.txt
          python -m pip install -e .

      - name: Correctness gate
        run: python -m pytest tests/ -q

      - name: Self-checks that are not pytest
        run: |
          python -m pinca_jax.stats
          python -m pinca_jax.physics
          python -m pinca_jax.models.baselines
          python -m pinca_jax.teacher_error --demo

      # Two phenomena, not all ten: this proves the driver, the checkpointing, the paired
      # statistics and the plotting are wired together. Running the whole matrix here would
      # take ~20 minutes to re-prove what the correctness gate already covers.
      - name: Pipeline wiring (tiny, CPU, numbers meaningless)
        run: |
          python -m pinca_jax.bench_all --pdes heat,cahn_hilliard --archs plain_nca,pi_nca,resnet_iso,identity --seeds 2 --epochs 30 --grid 16 --batch 4 --rollout 4 --eval 8 --force --allow-cpu
          python -m pinca_jax.teacher_error --grid 16 --steps 8 --allow-cpu
          python -m pinca_jax.plots

      # Regenerate the audit, the paper tables and every quoted number, and fail if any
      # count in the prose disagrees with what is actually in results/.
      - name: Documents must agree with the results
        run: |
          python -m pinca_jax.claims --strict-counts
          python -m pinca_jax.paper
          python -m pytest tests/test_paper.py -q
